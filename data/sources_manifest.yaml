- id: nsdc_india
  publisher: National Skill Development Corporation (NSDC) and relevant Sector Skill Councils / recognized awarding
    bodies
  name: National Occupational Standards (NOS), Qualification Packs (QP), and model curriculum listings
  official_url: https://www.nsdcindia.org/national-occupational-standards-and-model-curriculum
  listing_url: https://nsdcindia.org/national-occupational-standards
  geographic_scope: India
  source_role: Indian occupational competency and vocational qualification cross-check for relevant job roles.
  selection: selected_record_by_record_link_only_reference
  integration_status: not_integrated
  planned_access_method: Open official listing pages and retain links plus record metadata. Do not bulk scrape or
    redistribute full standard documents until the specific document terms or written permission are confirmed.
  runtime_access_status: not_tested_from_application_runtime
  source_page_review_status: official_nos_and_qp_listing_pages_reviewed_on_2026-10-17
  version_or_release: No single release applies to all job roles. Each QP/NOS has its own code, version/review status,
    and lifecycle; check the exact record.
  license_terms_status: No blanket reuse licence for the full corpus was verified on the reviewed pages. Some standards/listings
    contain specific training-use conditions, which must not be generalized to every document.
  attribution_and_changes: Preserve exact QP/NOS name, code, issuing Sector Skill Council, NSQF/approval status,
    page URL, and any stated permitted-use terms for each record.
  limits:
  - Listings distinguish NSQF-aligned/NSQC-cleared, under-industry-validation, draft/reviewed, and retired items;
    these statuses are not interchangeable.
  - Some retired-standard pages explicitly warn not to train against those retired standards; retired items must
    not be presented as current pathways.
  - NSDC vocational standards do not cover every academic, creative, research, or emerging occupation equally.
  - A job-role label matching another taxonomy does not establish that competencies or qualification levels are
    equivalent.
  reviewed_on: '2026-10-17'
  evidence_urls:
  - https://www.nsdcindia.org/national-occupational-standards-and-model-curriculum
  - https://nsdcindia.org/national-occupational-standards
  - https://nsdcindia.org/nos-listing/150
- id: onet_database
