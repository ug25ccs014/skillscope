# Source register and ingestion-state manifest. Curated extracts may be imported while full external sources remain separate.
# A curated sample integration never implies that its entire upstream taxonomy is imported or live.
manifest_version: 3
project: SkillScope AI
last_reviewed: '2026-10-17'
manifest_status: curated_extract_imported_external_access_blocked
policy:
- Do not mark a source integrated unless application code or an imported data artifact actually uses it.
- A public website being readable in research does not prove the application runtime can download the data or call
  its API.
- Keep source facts, cross-source mappings, user evidence, heuristics, and demo fixtures distinct.
- Never use aggregate labour-market statistics to score an individual student.
- Record the exact package version, retrieval date, licence/terms, source URL, and checksum at ingestion time.
sources:
