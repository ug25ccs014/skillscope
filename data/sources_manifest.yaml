  name: O*NET Database
  official_url: https://www.onetcenter.org/database.html
  release_archive_url: https://www.onetcenter.org/db_releases.html
  license_url: https://www.onetcenter.org/license_db.html
  geographic_scope: United States
  source_role: Supplementary structured occupations, skills, abilities, work activities, and task reference; not
    an India-specific labour-market source.
  selection: selected_for_future_curated_bulk_snapshot
  integration_status: not_integrated
  planned_access_method: Official versioned database bulk download, preferably selected tabular CSV/JSON files.
    Avoid Web Services for transformed local records unless the separate Web Services terms and constraints are
    deliberately accepted.
  runtime_access_status: official_download_options_verified_on_web;_local_download_not_tested
  source_page_review_status: official_current_release_and_database_license_reviewed_on_2026-10-17
  version_or_release: O*NET Database 31.0, August 2026; identified as the current production release on the official
    release page at review time.
  license_terms_status: Downloadable O*NET 31.0 Database files are licensed CC BY 4.0, subject to the exact database
    licence and its exceptions. Attribution must name the version, credit the U.S. Department of Labor / Employment
    and Training Administration, link the licence, and indicate modifications. Some external data on O*NET Web Services
    is covered by different terms.
  attribution_and_changes: Use the official attribution wording from the license page in the application/documentation;
    include version 31.0, link CC BY 4.0, and disclose SkillScope modifications. Do not imply U.S. DOL endorsed
    SkillScope.
  limits:
  - The O*NET-SOC taxonomy describes the U.S. economy and must not be used as Indian demand, wages, qualification
    rules, or hiring requirements.
  - Keep source ratings and occupational concepts distinct from student performance evidence and from SkillScope-authored
    mappings.
  - At ingestion, record the exact files, version, retrieval timestamp, source URLs, and SHA-256 digests.
