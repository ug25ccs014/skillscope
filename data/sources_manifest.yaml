- id: esco_classification
  publisher: European Commission, Directorate-General for Employment, Social Affairs and Inclusion
  name: European Skills, Competences, Qualifications and Occupations (ESCO) classification
  official_url: https://esco.ec.europa.eu/en/about-esco/escopedia/escopedia/what-esco-and-how-use-it
  download_url: https://esco.ec.europa.eu/en/use-esco/download
  api_url: https://esco.ec.europa.eu/en/use-esco/use-esco-services-api/esco-web-service-api
  license_terms_url: https://esco.ec.europa.eu/en/about-esco/faq?page=1
  geographic_scope: European classification context; multilingual taxonomy, not an India-specific labour-market
    model
  source_role: Supplementary occupation/skill concept graph and cross-source vocabulary reference. Use its stable
    concept URIs and occupation–skill relationships.
  selection: selected_for_future_version_pinned_bulk_extract
  integration_status: not_integrated
  planned_access_method: Official downloadable English CSV package with only the required classification/relationship
    modules; pin and inspect the exact package metadata before importing. Do not rely on an unpinned API default.
  runtime_access_status: official_download_options_and_reuse_conditions_verified_on_web;_package_download_not_tested
  source_page_review_status: official_download_api_and_reuse_FAQ_reviewed_on_2026-10-17
  version_or_release: Download page identifies ESCO v1.2.1 with last update 10 December 2025. The web-service API
    page lists default v1.0.9 and says v1.2.0 is also available; resolve this discrepancy by pinning and verifying
    the actual exported package/version metadata during ingestion.
  license_terms_status: The Commission states the ESCO classification can be reused free of charge under the EU
    Commission document reuse decision 2011/833/EU. Use must acknowledge the ESCO classification of the European
    Commission, and adapted/modified versions must be marked as such. API software component licences (e.g. EUPL/Apache)
    are distinct from the classification-data reuse terms.
  attribution_and_changes: 'For an application using ESCO, publish: “This service uses the ESCO classification of
    the European Commission.” Clearly identify SkillScope adaptations and retain each concept URI.'
  limits:
  - ESCO was designed for European labour-market interoperability; role, skill and credential relationships are
    not presumed equivalent to Indian contexts.
  - Do not translate taxonomic mapping into a claim of local hiring demand or accepted Indian qualification.
  - Avoid relying on the API default version because the official pages reviewed display a version discrepancy.
  - A taxonomy relation supports occupational knowledge, not a psychological assessment or individual fit verdict.
  reviewed_on: '2026-10-17'
  evidence_urls:
  - https://esco.ec.europa.eu/en/use-esco/download
  - https://esco.ec.europa.eu/en/use-esco/use-esco-services-api/esco-web-service-api
  - https://esco.ec.europa.eu/en/about-esco/faq?page=1
